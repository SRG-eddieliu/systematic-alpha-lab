[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "systematic-alpha-lab"
version = "0.1.0"
description = "AI-assisted systematic alpha research platform."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "pyarrow>=11",
    "requests>=2.31",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "PyYAML>=6.0",
    "wrds>=3.1",
]

[project.optional-dependencies]
yahoo = [
    "yfinance==1.7.0",
]
ml = [
    "xgboost>=2.0",
]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint.per-file-ignores]
# This v1 file is byte-pinned in captured evidence. Keep its source immutable;
# cosmetic import ordering / exception-style changes belong to a new version.
"src/systematic_alpha_lab/data_pipeline/yfinance_snapshots.py" = ["I001", "TRY004"]
