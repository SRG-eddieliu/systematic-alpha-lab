name: Research contracts
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.11']
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e '.[dev]'
      - run: pytest -q
      - run: python examples/consolidated_import_demo.py
      - run: python examples/av_batch_review_demo.py
      - run: python examples/sec_quarterly_review_demo.py
      - run: python examples/monthly_price_snapshot_demo.py
      - run: python examples/offline_data_access_demo.py
      - run: python examples/beneish_reproduction_demo.py
      - run: python examples/verify_integrity_method_contract.py
      - run: python examples/annual_beneish_demo.py
      - run: python examples/research_contracts_demo.py
      - run: python examples/shared_pipeline_demo.py
